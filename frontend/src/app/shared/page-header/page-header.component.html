<header class="page-header">
  <div class="ph-lead">
    <div class="ph-copy">
      <p class="ph-eyebrow" *ngIf="eyebrow">{{ eyebrow }}</p>
      <h1 class="ph-title">{{ titleLead }}<span *ngIf="titleLead"> </span><span class="ph-accent">{{ titleAccent }}</span></h1>
      <p class="ph-subtitle" *ngIf="subtitle">{{ subtitle }}</p>
    </div>
  </div>
  <div class="ph-actions">
    <ng-content></ng-content>
  </div>
</header>
