<div class="donut-chart" *ngIf="hasData()">
  <apx-chart
    [series]="series()"
    [chart]="chart"
    [labels]="labels()"
    [colors]="colors()"
    [fill]="fill()"
    [stroke]="stroke"
    [dataLabels]="dataLabels"
    [legend]="legend()"
    [plotOptions]="plotOptions()"
    [tooltip]="tooltip()"
  />
</div>
