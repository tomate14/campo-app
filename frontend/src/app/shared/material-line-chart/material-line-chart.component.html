<div class="material-chart-shell" *ngIf="hasData(); else empty">
  <apx-chart
    [series]="series()"
    [chart]="chart()"
    [colors]="colors()"
    [stroke]="stroke()"
    [fill]="fill()"
    [markers]="markers()"
    [xaxis]="xaxis()"
    [yaxis]="yaxis()"
    [grid]="grid"
    [legend]="{ show: false }"
    [dataLabels]="{ enabled: false }"
    [tooltip]="tooltip()"
  />
</div>

<ng-template #empty>
  <div class="material-chart-empty">{{ emptyText }}</div>
</ng-template>
