<div class="bar-shell" *ngIf="hasData(); else empty">
  <div class="bar-legend">
    <span><i [style.background]="color"></i>{{ seriesLabel }}</span>
    <span *ngIf="averageValue != null"><i class="average"></i>{{ averageLabel }}</span>
  </div>
  <apx-chart
    [series]="series()"
    [chart]="chart()"
    [colors]="[color]"
    [fill]="fill()"
    [plotOptions]="plotOptions"
    [dataLabels]="dataLabels"
    [xaxis]="xaxis()"
    [yaxis]="yaxis()"
    [grid]="grid"
    [annotations]="annotations()"
    [tooltip]="tooltip()"
    [legend]="{ show: false }"
  />
</div>

<ng-template #empty>
  <div class="bar-empty">{{ emptyText }}</div>
</ng-template>
