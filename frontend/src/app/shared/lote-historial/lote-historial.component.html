<div class="history-timeline-wrap">
  <div class="empty-box" *ngIf="loading()">Cargando historial del lote...</div>
  <div class="history-timeline" *ngIf="!loading() && eventos().length; else emptyHistory">
    <button
      type="button"
      class="history-card"
      *ngFor="let evento of eventos(); let i = index"
      [class.history-card--open]="expandido() === i"
      [style.--kind-color]="evento.color"
      (click)="toggle(i)"
    >
      <span class="history-card__band"></span>
      <div class="history-card__body">
        <div class="history-card__top">
          <span class="history-card__kind">{{ evento.tipo }}</span>
          <span class="history-card__date">{{ evento.fecha | date:'dd/MM/yyyy HH:mm' }}</span>
        </div>
        <div class="history-card__title">{{ evento.titulo }}</div>
        <div class="history-card__detail" *ngIf="expandido() === i">
          <div class="history-card__row" *ngFor="let campo of evento.campos">
            <span class="history-card__label">{{ campo.label }}</span>
            <span class="history-card__value">{{ campo.value }}</span>
          </div>
          <div class="history-card__empty" *ngIf="!evento.campos.length">Sin datos adicionales.</div>
        </div>
      </div>
      <svg class="history-card__chevron" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <polyline points="6 9 12 15 18 9"></polyline>
      </svg>
    </button>
  </div>
  <ng-template #emptyHistory><div class="empty-box" *ngIf="!loading()">Todav&iacute;a no hay eventos asociados a este lote.</div></ng-template>
</div>
