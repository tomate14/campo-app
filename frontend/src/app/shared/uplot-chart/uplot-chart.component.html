<div class="uplot-shell">
  <div class="uplot-legend" *ngIf="hasData">
    <span class="legend-item">
      <span class="legend-swatch legend-swatch--bar" [style.background]="color"></span>
      <span>{{ seriesLabel }}</span>
    </span>
    <span class="legend-item" *ngIf="showAverage">
      <span class="legend-swatch legend-swatch--line" [style.background]="averageColor"></span>
      <span>{{ averageLabel }}</span>
    </span>
  </div>
  <div class="uplot-axis-head" *ngIf="hasData">
    <span class="uplot-axis-title uplot-axis-title--y">{{ yAxisTitle }}</span>
  </div>
  <div #chartHost class="uplot-host" [style.height.px]="height"></div>
  <div class="uplot-axis-foot" *ngIf="hasData">
    <span class="uplot-axis-title uplot-axis-title--x">{{ xAxisTitle }}</span>
  </div>
  <div
    #tooltipRef
    class="uplot-tooltip"
    *ngIf="tooltipVisible"
    [style.left.px]="tooltipX"
    [style.top.px]="tooltipY"
  >
    <div class="uplot-tooltip__head">
      <span class="uplot-tooltip__icon">{{ tooltipIcon }}</span>
      <span class="uplot-tooltip__series">{{ seriesLabel }}</span>
    </div>
    <div class="uplot-tooltip__value">{{ tooltipValue }}</div>
    <div class="uplot-tooltip__meta">{{ tooltipReferenceLabel }}: {{ tooltipLabel }}</div>
  </div>
  <div class="uplot-empty" *ngIf="!hasData">Sin datos para graficar.</div>
</div>
