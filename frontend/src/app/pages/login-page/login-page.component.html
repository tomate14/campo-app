<div class="login-page">
  <!-- Fondo: mapa de lotes (decorativo) -->
  <div class="lotes-bg" aria-hidden="true">
    <div class="lotes-grid">
      <div class="tile" style="grid-area:1/1/3/4;border:1px solid rgba(159,232,112,0.2);background:repeating-linear-gradient(35deg, rgba(159,232,112,0.22) 0 2px, transparent 2px 10px), rgba(77,124,15,0.45);"></div>
      <div class="tile" style="grid-area:1/4/2/7;border:1px solid rgba(159,232,112,0.14);background:repeating-linear-gradient(90deg, rgba(159,232,112,0.14) 0 2px, transparent 2px 9px), rgba(159,232,112,0.12);"></div>
      <div class="tile" style="grid-area:2/4/4/6;border:1px solid rgba(159,232,112,0.2);background:repeating-linear-gradient(35deg, rgba(159,232,112,0.3) 0 2px, transparent 2px 10px), rgba(77,124,15,0.6);"></div>
      <div class="tile" style="grid-area:2/6/4/7;border:1px solid rgba(180,83,9,0.3);background:rgba(180,83,9,0.22);"></div>
      <div class="tile" style="grid-area:1/7/3/10;border:1px solid rgba(180,83,9,0.3);background:radial-gradient(circle at 30% 40%, rgba(255,184,77,0.12), transparent 50%), rgba(180,83,9,0.28);"></div>
      <div class="tile" style="grid-area:1/10/4/13;border:1px solid rgba(159,232,112,0.2);background:repeating-linear-gradient(-20deg, rgba(159,232,112,0.2) 0 2px, transparent 2px 11px), rgba(77,124,15,0.35);"></div>
      <div class="tile" style="grid-area:3/1/6/3;border:1px solid rgba(159,232,112,0.2);background:repeating-linear-gradient(0deg, rgba(159,232,112,0.26) 0 2px, transparent 2px 9px), rgba(77,124,15,0.55);"></div>
      <div class="tile" style="grid-area:3/3/5/4;border:1px solid rgba(148,163,184,0.12);background:rgba(30,41,59,0.8);"></div>
      <div class="tile" style="grid-area:3/7/6/10;border:1px solid rgba(159,232,112,0.2);background:repeating-linear-gradient(55deg, rgba(159,232,112,0.3) 0 2px, transparent 2px 10px), rgba(159,232,112,0.2);"></div>
      <div class="tile" style="grid-area:4/4/7/7;border:1px solid rgba(159,232,112,0.2);background:repeating-linear-gradient(35deg, rgba(159,232,112,0.18) 0 2px, transparent 2px 10px), rgba(77,124,15,0.4);"></div>
      <div class="tile" style="grid-area:4/10/6/13;border:1px solid rgba(180,83,9,0.3);background:rgba(180,83,9,0.2);"></div>
      <div class="tile" style="grid-area:5/3/9/4;border:1px solid rgba(8,145,178,0.3);background:rgba(8,145,178,0.16);"></div>
      <div class="tile" style="grid-area:6/1/9/3;border:1px solid rgba(180,83,9,0.3);background:rgba(180,83,9,0.26);"></div>
      <div class="tile" style="grid-area:6/7/9/9;border:1px solid rgba(159,232,112,0.2);background:repeating-linear-gradient(-35deg, rgba(159,232,112,0.28) 0 2px, transparent 2px 10px), rgba(77,124,15,0.5);"></div>
      <div class="tile" style="grid-area:6/9/9/13;border:1px solid rgba(159,232,112,0.14);background:repeating-linear-gradient(90deg, rgba(159,232,112,0.16) 0 2px, transparent 2px 9px), rgba(159,232,112,0.1);"></div>
      <div class="tile" style="grid-area:7/4/9/7;border:1px solid rgba(159,232,112,0.2);background:repeating-linear-gradient(20deg, rgba(159,232,112,0.24) 0 2px, transparent 2px 10px), rgba(77,124,15,0.35);"></div>
    </div>
    <span class="lote-chip chip-green chip-tl"><i></i>L-12 · Soja</span>
    <span class="lote-chip chip-amber chip-tr"><i></i>Potrero 4 · Recría</span>
    <span class="lote-chip chip-green chip-br"><i></i>L-21 · Trigo</span>
    <span class="lote-chip chip-green chip-bl"><i></i>L-07 · Maíz</span>
    <div class="vignette"></div>
  </div>

  <!-- Tarjeta de acceso -->
  <section class="login-card">
    <span class="card-strip" aria-hidden="true"></span>

    <div class="card-top">
      <div class="emblem">
        <div class="emblem-item">
          <span class="emblem-icon sm"><img src="/login/icono1-sm.png" alt="Ganadería" /></span>
          <span class="emblem-label">Ganadería</span>
        </div>
        <span class="emblem-line line-green"></span>
        <div class="emblem-item">
          <span class="emblem-icon lg"><img src="/login/icono2-sm.png" alt="Agricultura" /></span>
          <span class="emblem-label active">Agricultura</span>
        </div>
        <span class="emblem-line line-cyan"></span>
        <div class="emblem-item">
          <span class="emblem-icon sm"><img src="/login/icono3-sm.png" alt="Gestión" /></span>
          <span class="emblem-label">Gestión</span>
        </div>
      </div>

      <div class="card-heading">
        <h1>Ingresar</h1>
        <p>Accedé con tu cuenta para ver lotes, rodeos y órdenes del día.</p>
      </div>
    </div>

    <form class="login-form" (ngSubmit)="submit()">
      <label class="field">
        <span class="field-label">Email</span>
        <div class="field-control">
          <svg class="field-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16v12H4z" /><path d="m4 7 8 6 8-6" /></svg>
          <input [(ngModel)]="email" name="email" type="email" required autocomplete="email" placeholder="nombre@establecimiento.com" />
        </div>
      </label>

      <label class="field">
        <span class="field-label">Password</span>
        <div class="field-control">
          <svg class="field-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 11h12v9H6z" /><path d="M8.5 11V8a3.5 3.5 0 0 1 7 0v3" /></svg>
          <input [(ngModel)]="password" name="password" [type]="showPassword ? 'text' : 'password'" required autocomplete="current-password" placeholder="••••••••" />
          <button type="button" class="eye-btn" (click)="togglePassword()" [attr.aria-label]="showPassword ? 'Ocultar contraseña' : 'Mostrar contraseña'">
            <svg *ngIf="!showPassword" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z" /><path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6Z" /></svg>
            <svg *ngIf="showPassword" viewBox="0 0 24 24" aria-hidden="true"><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c6.5 0 10 8 10 8a18.5 18.5 0 0 1-2.16 3.19" /><path d="M6.61 6.61A18.5 18.5 0 0 0 2 12s3.5 7 10 7a9.12 9.12 0 0 0 4.4-1.11" /><path d="M14.12 14.12a3 3 0 1 1-4.24-4.24" /><path d="m2 2 20 20" /></svg>
          </button>
        </div>
      </label>

      <p class="error" *ngIf="errorMessage">{{ errorMessage }}</p>

      <button class="submit" type="submit" [disabled]="loading">{{ loading ? 'Procesando...' : 'Entrar' }}</button>

      <button type="button" class="link-forgot" (click)="toggleHelp()">¿Olvidaste tu contraseña?</button>
    </form>

    <div class="help-pill">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 18h.01" /><path d="M9.5 9a2.7 2.7 0 1 1 4.7 1.8c-.9.8-1.7 1.4-1.9 2.7" /><path d="M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20Z" /></svg>
      <span>¿Necesitás ayuda?</span>
      <button type="button" class="help-link" (click)="toggleHelp()">Contactar</button>
    </div>

    <p class="help-note" *ngIf="showHelp">Las cuentas y contraseñas las gestiona el administrador de tu establecimiento.</p>
  </section>
</div>
