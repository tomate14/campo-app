<div class="page" *ngIf="lote">
  <div class="page-head">
    <div>
      <button class="btn-secondary" routerLink="/agricola/lotes">< Volver</button>
      <h2>{{ lote.nombre }}</h2>
      <p>{{ lote.cultivoNombre }} - {{ lote.temporada }} - {{ lote.area }} ha</p>
    </div>
  </div>

  <div class="card map-card">
    <mgl-map [mapStyle]="mapStyle" [zoom]="zoom" [center]="center">
      <mgl-geojson-source id="lote-source" [data]="mapData"></mgl-geojson-source>
      <mgl-layer id="lote-fill" type="fill" source="lote-source" [paint]="fillPaint"></mgl-layer>
      <mgl-layer id="lote-line" type="line" source="lote-source" [paint]="linePaint"></mgl-layer>
    </mgl-map>
  </div>
</div>
