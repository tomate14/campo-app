<div class="shell">
  <aside class="sidebar" [class.collapsed]="collapsed()">
    <div class="brand-row">
      <div class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24">
          <path d="M5 18c7 0 12-5 12-12-7 0-12 5-12 12Z" />
          <path d="M5 18c0-6 4-10 10-12" />
          <path d="M12 19v-7" />
          <path d="M12 14h6" />
        </svg>
      </div>
      <div class="brand-copy" *ngIf="!collapsed()">
        <strong>Campo App</strong>
        <span>AgroERP</span>
      </div>
      <button class="brand-toggle" type="button" (click)="toggleSidebar()" [title]="collapsed() ? 'Expandir sidebar' : 'Colapsar sidebar'">
        <svg viewBox="0 0 24 24">
          <path d="M9 6l6 6-6 6" *ngIf="collapsed()" />
          <path d="M15 6l-6 6 6 6" *ngIf="!collapsed()" />
        </svg>
      </button>
    </div>

    <nav class="nav-section" aria-label="Menu principal">
      <div class="section-title" *ngIf="!collapsed()">Agricultura</div>

      <a routerLink="/agricola/lotes" routerLinkActive="active" class="nav-link" [title]="collapsed() ? 'Lotes' : ''">
        <svg viewBox="0 0 24 24"><path d="M4 7l8-3 8 3v10l-8 3-8-3V7Z" /><path d="M12 4v16" /><path d="M4 7l8 3 8-3" /></svg>
        <span *ngIf="!collapsed()">Lotes</span>
      </a>

      <a routerLink="/agricola/siembra" routerLinkActive="active" class="nav-link" [title]="collapsed() ? 'Siembra' : ''">
        <svg viewBox="0 0 24 24"><path d="M12 21V8" /><path d="M6 12c4 0 6-2 6-6-4 0-6 2-6 6Z" /><path d="M18 15c-4 0-6-2-6-6 4 0 6 2 6 6Z" /></svg>
        <span *ngIf="!collapsed()">Siembra</span>
      </a>

      <a routerLink="/agricola/cosecha" routerLinkActive="active" class="nav-link" [title]="collapsed() ? 'Cosecha' : ''">
        <svg viewBox="0 0 24 24"><path d="M6 20V8" /><path d="M10 20V5" /><path d="M14 20V7" /><path d="M18 20V9" /><path d="M4 20h16" /></svg>
        <span *ngIf="!collapsed()">Cosecha</span>
      </a>

      <a routerLink="/agricola/analytics" routerLinkActive="active" class="nav-link" [title]="collapsed() ? 'Analytics' : ''">
        <svg viewBox="0 0 24 24"><path d="M4 19h16" /><path d="M7 16V9" /><path d="M12 16V5" /><path d="M17 16v-4" /></svg>
        <span *ngIf="!collapsed()">Analytics</span>
      </a>

      <a routerLink="/clima" routerLinkActive="active" class="nav-link" [title]="collapsed() ? 'Clima' : ''">
        <svg viewBox="0 0 24 24"><path d="M7 18h10a4 4 0 0 0 0-8 6 6 0 0 0-11.6 1.8A3.5 3.5 0 0 0 7 18Z" /><path d="M12 3v2" /><path d="M20 5l-1.5 1.5" /></svg>
        <span *ngIf="!collapsed()">Clima</span>
      </a>

      <div class="section-title" *ngIf="!collapsed()">Ganadería</div>

      <a routerLink="/ganaderia/trazabilidad" routerLinkActive="active" class="nav-link" [title]="collapsed() ? 'Trazabilidad' : ''">
        <svg viewBox="0 0 24 24"><path d="M5 8c0-3 3-5 7-5s7 2 7 5c0 4-3 7-7 7S5 12 5 8Z" /><path d="M8 5L5 3" /><path d="M16 5l3-2" /><path d="M9 11h.01" /><path d="M15 11h.01" /><path d="M10 15v4h4v-4" /></svg>
        <span *ngIf="!collapsed()">Trazabilidad</span>
      </a>

      <a routerLink="/ganaderia/sanidad" routerLinkActive="active" class="nav-link" [title]="collapsed() ? 'Sanidad' : ''">
        <svg viewBox="0 0 24 24"><path d="M12 21s7-4 7-11V5l-7-3-7 3v5c0 7 7 11 7 11Z" /><path d="M12 8v6" /><path d="M9 11h6" /></svg>
        <span *ngIf="!collapsed()">Sanidad</span>
      </a>

      <a routerLink="/ganaderia/reproduccion" routerLinkActive="active" class="nav-link" [title]="collapsed() ? 'Reproducción' : ''">
        <svg viewBox="0 0 24 24"><path d="M7 7a4 4 0 1 0 8 0 4 4 0 0 0-8 0Z" /><path d="M11 11v10" /><path d="M7 17h8" /><path d="M17 4h3v3" /><path d="M20 4l-5 5" /></svg>
        <span *ngIf="!collapsed()">Reproducción</span>
      </a>

      <a routerLink="/ganaderia/alimentacion" routerLinkActive="active" class="nav-link" [title]="collapsed() ? 'Alimentación' : ''">
        <svg viewBox="0 0 24 24"><path d="M4 19c6-9 12-9 16 0" /><path d="M8 13c2-4 6-4 8 0" /><path d="M12 5v15" /><path d="M7 7h10" /></svg>
        <span *ngIf="!collapsed()">Alimentación</span>
      </a>
    </nav>

    <div class="sidebar-footer">
      <button class="footer-action" type="button" (click)="toggleSidebar()" [title]="collapsed() ? 'Expandir' : 'Colapsar'">
        <svg viewBox="0 0 24 24">
          <path d="M9 6l6 6-6 6" *ngIf="collapsed()" />
          <path d="M15 6l-6 6 6 6" *ngIf="!collapsed()" />
        </svg>
        <span *ngIf="!collapsed()">Colapsar</span>
      </button>
      <button class="footer-action" type="button" title="Centro de ayuda">
        <svg viewBox="0 0 24 24"><path d="M12 18h.01" /><path d="M9.5 9a2.7 2.7 0 1 1 4.7 1.8c-.9.8-1.7 1.4-1.9 2.7" /><path d="M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20Z" /></svg>
        <span *ngIf="!collapsed()">Centro de ayuda</span>
      </button>
      <button class="footer-action logout-action" type="button" (click)="logout()" title="Salir">
        <svg viewBox="0 0 24 24"><path d="M10 17l5-5-5-5" /><path d="M15 12H3" /><path d="M21 4v16" /></svg>
        <span *ngIf="!collapsed()">Salir</span>
      </button>
    </div>
  </aside>

  <main class="main-panel">
    <header class="topbar">
      <div class="user-chip">
        <span class="user-avatar">{{ currentUserInitials }}</span>
        <span class="user-copy">
          <strong>{{ currentUserName }}</strong>
          <small>{{ currentUserRole }}</small>
        </span>
        <svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6" /></svg>
      </div>
    </header>

    <section class="content-area">
      <router-outlet />
    </section>
  </main>
</div>
