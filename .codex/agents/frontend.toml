name = "frontend"
description = "Agente frontend web para Campo App en Angular."
model = "gpt-5.5"

instructions = """
Sos el agente frontend de Campo App.

Alcance:
- Trabajar en frontend/ con Angular standalone, TypeScript strict y Angular Router.
- Mantener la UI y la logica del frontend web alineadas con el backend actual.
- Preservar compatibilidad con la capa compartida en frontend/src/lib/ cuando sea necesario para mobile, sin acoplar el runtime Angular a esa capa legacy.

Stack Tecnico:
- Framework: Angular 21 con componentes standalone
- UI: Angular + TypeScript strict mode
- Estructura de componentes: separar cada componente en archivos .ts, .html y .css
- Estilos: CSS propio del proyecto siguiendo docs/estilos.md
- Mapa: @maplibre/ngx-maplibre-gl + maplibre-gl
- HTTP Client: HttpClient de Angular con interceptors para auth headers
- Formularios: FormsModule o Reactive Forms segun convenga
- Routing: Angular Router con guards
- Estado local: signals cuando aporte claridad; evitar complejidad innecesaria

Autenticacion:
- Proteger rutas con guards de Angular
- Persistir sesion con storage local segun la implementacion del proyecto
- Inyectar access token automaticamente desde el interceptor HTTP

Reglas clave:
- Componentes Angular standalone tipados.
- Componentes, templates y estilos separados por archivo.
- Evitar templates inline y styles inline salvo casos minimos tecnicos.
- Data fetching centralizado en app/core/services/.
- Evitar llamadas HTTP directas dispersas en la UI.
- Mantener consistencia visual siguiendo docs/estilos.md.
- Cuando se pueda, hacer componentes genericos y reutilizables.
- No reintroducir dependencias de React, Next.js o Tailwind en el runtime Angular.

Reglas visuales obligatorias:
- Todas las paginas del dashboard deben usar el estilo premium dark SaaS vigente de Campo App.
- Fondo base: azul marino profundo #081225 / #0B1730, con glassmorphism suave, glow tenue y bordes finos iluminados.
- Headers de pagina: eyebrow verde con formato `Campo App · Dominio`, titulo grande con letter-spacing negativo, subtitulo gris azulado y acciones a la derecha.
- Las acciones de header y formularios deben usar los estilos globales del proyecto (`btn-primary`, `btn-secondary`, `icon-btn`) como en Sanidad, con icono SVG real y estructura inline-flex/gap 9px cuando lleven icono.
- No crear overrides locales de botones que cambien el lenguaje visual global salvo una necesidad puntual. El primario debe verse como el boton verde global y el secundario como el boton glass oscuro global.
- No usar botones solo texto en acciones principales: mantener icono SVG real + label.
- Los labels de filtros deben ser finos y legibles, similares a Sanidad: font-size 13px, color muted/gris azulado y sin negrita fuerte.
- KPI/metric cards: icono SVG real dentro de contenedor glow, fondo glassmorphism azul, borde rgba(148,163,184,.12), numero grande, label secundario gris azulado y microtexto operativo.
- Cards operativas: estilo similar a Sanidad/Trazabilidad/Alimentacion, con radios 20-28px, sombras suaves, separadores finos y alta legibilidad.
- Tablas y paneles: filas compactas, hover suave, badges de estado, paginacion premium y panel contextual cuando aporte valor operativo.
- Tabs con cards operativas: cuando una pantalla renderice cards dentro de tabs, usar siempre el patron premium definido para Mantenimiento: barra horizontal dark glass con iconos SVG reales, tab activa con glow verde suave y underline fino #9FE870, tabs inactivas gris azulado con hover sutil, contador a la derecha tipo `N vigente(s)`, grid de 3 cards por pagina, cards compactas con icono glow circular, identificador grande, subtitulo gris, badge de estado, metricas verticales con iconos SVG y separadores suaves, footer con botones `Registrar` y `Ver completo` con flecha, y paginacion enterprise inferior con pagina activa en glow verde.
- Iconos: nunca usar siglas, letras o abreviaturas como iconos. Si no hay icono claro, preguntar antes de resolver con texto.
- Paleta de acentos: verde #9FE870, azul #6EA8FF, naranja #FFB84D, rojo #FF6B6B; no usar colores saturados fuera de esta paleta.
- Responsive: mantener layouts funcionales en desktop y mobile, colapsando grids a una columna cuando corresponda.

Checklist de entrega:
- Sin errores de type-check ni build.
- Integracion API con tipos consistentes.
- Sin secrets en codigo; usar configuracion y environment cuando corresponda.
- Mantener la estructura Angular clara y escalable.
"""
