services:

  # ============================================================
  # Base de Datos - MySQL 8.0
  # ============================================================
  db:
    image: mysql:8.0
    container_name: campo-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASS}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASS}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - /var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${DB_ROOT_PASS}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - campo-net

  # ============================================================
  # Backend - Spring Boot 3 / Java 17
  # ============================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: campo-backend
    restart: unless-stopped
    mem_limit: 1536m
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASS}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ACCESS_EXPIRATION_MS: ${JWT_ACCESS_EXPIRATION_MS}
      JWT_REFRESH_EXPIRATION_MS: ${JWT_REFRESH_EXPIRATION_MS}
      RATE_LIMIT_LOGIN_MAX_ATTEMPTS: ${RATE_LIMIT_LOGIN_MAX_ATTEMPTS}
      RATE_LIMIT_LOGIN_BLOCK_MINUTES: ${RATE_LIMIT_LOGIN_BLOCK_MINUTES}
      OAUTH2_GOOGLE_CLIENT_ID: ${OAUTH2_GOOGLE_CLIENT_ID}
      OAUTH2_GOOGLE_CLIENT_SECRET: ${OAUTH2_GOOGLE_CLIENT_SECRET}
      OAUTH2_AZURE_TENANT: ${OAUTH2_AZURE_TENANT}
      OAUTH2_AZURE_CLIENT_ID: ${OAUTH2_AZURE_CLIENT_ID}
      OAUTH2_AZURE_CLIENT_SECRET: ${OAUTH2_AZURE_CLIENT_SECRET}
      FRONTEND_URL: http://frontend:3000
      # Feature 76: si es true, carga el dataset de demo al arrancar (idempotente).
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-false}
      UPLOADS_DIR: /app/uploads
      # Feature 59: NDVI / mapa de verdes (Sentinel-2 via CDSE).
      NDVI_ENABLED: ${NDVI_ENABLED:-true}
      NDVI_CLIENT_ID: ${NDVI_CLIENT_ID:-}
      NDVI_CLIENT_SECRET: ${NDVI_CLIENT_SECRET:-}
      NDVI_TOKEN_URL: ${NDVI_TOKEN_URL:-https://identity.dataspace.copernicus.eu/auth/realms/CDSE/protocol/openid-connect/token}
      NDVI_PROCESS_URL: ${NDVI_PROCESS_URL:-https://sh.dataspace.copernicus.eu/api/v1/process}
      NDVI_DIR: /app/ndvi
      NDVI_SYNC_CRON: ${NDVI_SYNC_CRON:-0 0 4 */15 * *}
      NDVI_VENTANA_DIAS: ${NDVI_VENTANA_DIAS:-15}
      NDVI_MAX_NUBOSIDAD: ${NDVI_MAX_NUBOSIDAD:-40}
      NDVI_IMG_SIZE: ${NDVI_IMG_SIZE:-512}
      # Feature 85: cotizacion del Dolar BNA (fuente publica sin credenciales).
      COTIZACION_DOLAR_ENABLED: ${COTIZACION_DOLAR_ENABLED:-true}
      COTIZACION_DOLAR_URL: ${COTIZACION_DOLAR_URL:-https://dolarapi.com/v1/dolares/oficial}
      COTIZACION_DOLAR_SYNC_CRON: ${COTIZACION_DOLAR_SYNC_CRON:-0 0 8,14 * * *}
    volumes:
      - backend_uploads:/app/uploads
      - backend_ndvi:/app/ndvi
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/api/v1/docs || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 60s
    networks:
      - campo-net

  # ============================================================
  # Frontend - Angular 21
  # ============================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: campo-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      NODE_ENV: development
      CHOKIDAR_USEPOLLING: "true"
      NG_CLI_ANALYTICS: "false"
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    networks:
      - campo-net

  # ============================================================
  # Mobile - Expo Dev Server (Metro Bundler)
  # ============================================================
  mobile:
    build:
      context: ./mobile
      dockerfile: Dockerfile
    container_name: campo-mobile
    restart: unless-stopped
    environment:
      NODE_OPTIONS: --max-old-space-size=4096
      EXPO_NO_STATIC_RENDERING: "1"
      EXPO_NO_TELEMETRY: "1"
      # Evita que expo consulte api.expo.dev al arrancar (respuestas vacias por
      # conectividad tiraban abajo el CLI). En dev no se necesita esa verificacion.
      EXPO_OFFLINE: "1"
      REACT_NATIVE_PACKAGER_HOSTNAME: ${HOST_IP}
      EXPO_DEVTOOLS_LISTEN_ADDRESS: 0.0.0.0
      API_URL: http://${HOST_IP}:${BACKEND_PORT:-8080}/api/v1
    ports:
      - "${MOBILE_PORT:-8081}:8081"
      - "${EXPO_PORT_DEVTOOLS:-19000}:19000"
      - "${EXPO_PORT_WEB:-19006}:19006"
    command: >
      sh -c "if [ ! -d node_modules/react-dom ] || [ ! -d node_modules/react-native-web ]; then npm install --legacy-peer-deps; fi &&
      npx expo start --web --host localhost --port 19006"
    volumes:
      - ./mobile:/app
      - mobile_node_modules:/app/node_modules
    networks:
      - campo-net

volumes:
  frontend_node_modules:
  mobile_node_modules:
  backend_uploads:
  backend_ndvi:

networks:
  campo-net:
    driver: bridge
