spring:
  application:
    name: campo-app-backend

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:campo_db}?useSSL=false&serverTimezone=America/Argentina/Buenos_Aires&allowPublicKeyRetrieval=true
    username: ${DB_USER:campo_user}
    password: ${DB_PASS:campo_pass}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    clean-disabled: false
    clean-on-validation-error: true

  servlet:
    multipart:
      max-file-size: 6MB
      max-request-size: 12MB

# Almacenamiento de archivos en filesystem (feature 54)
campo:
  storage:
    uploads-dir: ${UPLOADS_DIR:/app/uploads}

# JWT
jwt:
  secret: ${JWT_SECRET:campoapp-super-secret-key-256bits-development-only-change-in-prod}
  access-token-expiration-ms: ${JWT_ACCESS_EXPIRATION_MS:43200000}    # 12 horas
  refresh-token-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000} # 7 días

# Rate limiting
rate-limit:
  login:
    max-attempts: 5
    block-duration-minutes: 15

# OAuth2 providers
oauth2:
  google:
    client-id: ${OAUTH2_GOOGLE_CLIENT_ID:}
    client-secret: ${OAUTH2_GOOGLE_CLIENT_SECRET:}
  azure:
    tenant: ${OAUTH2_AZURE_TENANT:}
    client-id: ${OAUTH2_AZURE_CLIENT_ID:}
    client-secret: ${OAUTH2_AZURE_CLIENT_SECRET:}

# Clima - Open-Meteo
clima:
  open-meteo:
    base-url: https://api.open-meteo.com/v1
  sync:
    enabled: ${CLIMA_SYNC_ENABLED:true}
    intervalo-ms: ${CLIMA_SYNC_INTERVALO_MS:1800000}
  retencion-dias: 30
  forecast-days: 7

# GBIF - Catalogo de referencia de plagas (feature 73)
gbif:
  base-url: https://api.gbif.org/v1
  media-limit: 5
  sync:
    enabled: ${GBIF_SYNC_ENABLED:true}
    cron: ${GBIF_SYNC_CRON:0 0 3 * * *}
  # Feature 75: topes del descubrimiento de especies similares.
  similar:
    max-por-nivel: ${GBIF_SIMILAR_MAX_POR_NIVEL:12}
    max-niveles: ${GBIF_SIMILAR_MAX_NIVELES:2}

# Springdoc
springdoc:
  api-docs:
    path: /api/v1/docs
  swagger-ui:
    path: /api/v1/swagger-ui.html
  paths-to-match: /api/v1/**

# Logging
logging:
  level:
    com.campoapp: DEBUG
    org.springframework.security: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

server:
  port: 8080
  servlet:
    context-path: /

---
spring:
  config:
    activate:
      on-profile: test
  datasource:
    url: jdbc:tc:mysql:8.0:///campo_test_db
    driver-class-name: org.testcontainers.jdbc.ContainerDatabaseDriver
  flyway:
    enabled: true
