spring:
  main:
    lazy-initialization: true
  data:
    jpa:
      repositories:
        bootstrap-mode: lazy
  datasource:
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:4}
      minimum-idle: ${DB_POOL_MIN_IDLE:0}
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:10000}
      max-lifetime: ${DB_MAX_LIFETIME_MS:540000}
  flyway:
    enabled: false
    clean-disabled: true
    clean-on-validation-error: false
  lifecycle:
    timeout-per-shutdown-phase: 25s

server:
  port: ${PORT:80}
  shutdown: graceful

app:
  scheduling:
    enabled: false

logging:
  level:
    com.campoapp: INFO
